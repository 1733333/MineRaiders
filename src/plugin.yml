name: MineRaiders
version: 1.0
author: YaoGuai
main: MR
api-version: 1.21
commands:
  mineraidersdebug:
    description: debug command
    aliases:
      - mrd
      - mrdebug
    usage: /mineraidersdebug [index]
  getloots:
    description: get all loots
    usage: /getloots
  getgadgets:
    description: get all gadgets
    usage: /getgadgets
  getweapons:
    description: get all weapons
    usage: /getweapons
  getarmors:
    description: get all armors
    usage: /getarmors
  getrecipes:
    description: get all recipes
    usage: /getrecipes
  getfreerecipes:
    description: get all free recipes
    usage: /getfreerecipes
  getdrops:
    description: get all drops
    usage: /getdrops
  getall:
    description: open a menu
    usage: /getall
  mrlocs:
    description: 搜打撤位置管理指令
    usage: /mrlocs <子命令>
    aliases:
      - mrl
      - mrloc